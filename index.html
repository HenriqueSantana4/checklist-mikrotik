const sections=[{"title":"Preparação e acesso","items":[{"title":"Identificar as portas WAN e LAN","steps":["Defina qual porta receberá a internet. Exemplo: <span class='path'>ether1</span> como WAN.","Defina quais portas serão usadas na rede interna. Exemplo: <span class='path'>ether2 a ether5</span> como LAN.","Conecte o cabo do modem ou ONU na porta WAN.","Conecte o computador em uma porta LAN.","Durante a configuração, evite ligar o MikroTik diretamente em uma rede de produção sem antes revisar os endereços IP."]},{"title":"Acessar o MikroTik pelo WinBox usando o MAC Address","steps":["Abra o WinBox no computador.","Entre na guia <span class='path'>Neighbors</span>.","Localize o MikroTik pelo MAC Address.","Clique no equipamento e conecte com o usuário <span class='path'>admin</span>.","Se o equipamento estiver zerado, a senha poderá estar em branco ou impressa na etiqueta, dependendo do modelo."]},{"title":"Remover a configuração padrão para configurar do zero","steps":["No primeiro acesso, clique em <span class='path'>Remove Configuration</span>, caso essa opção apareça.","Se não aparecer, abra <span class='path'>System → Reset Configuration</span>.","Marque <span class='path'>No Default Configuration</span>.","Clique em <span class='path'>Reset Configuration</span>.","Aguarde o reinício e acesse novamente pelo MAC Address."],"note":"Faça isso apenas quando tiver certeza de que não existe uma configuração importante no equipamento."}]},{"title":"Proteção do acesso administrativo","items":[{"title":"Criar um novo usuário administrador","steps":["Abra <span class='path'>System → Users</span>.","Clique em <span class='path'>+</span>.","Crie um nome de usuário diferente de admin.","Selecione o grupo <span class='path'>full</span>.","Defina uma senha forte, com letras maiúsculas, minúsculas, números e símbolos.","Salve e teste o novo usuário antes de remover o usuário antigo."]},{"title":"Desativar ou remover o usuário admin padrão","steps":["Entre novamente no MikroTik usando o novo usuário.","Abra <span class='path'>System → Users</span>.","Selecione o usuário <span class='path'>admin</span>.","Clique em desativar ou remover.","Confirme que o novo usuário continua acessando normalmente."]},{"title":"Desativar serviços de gerenciamento desnecessários","steps":["Abra <span class='path'>IP → Services</span>.","Desative <span class='path'>telnet</span>.","Desative <span class='path'>ftp</span>.","Desative <span class='path'>www</span> se não usar WebFig.","Desative <span class='path'>www-ssl</span> se não usar WebFig com HTTPS.","Desative <span class='path'>api</span> e <span class='path'>api-ssl</span> se não houver integração.","Mantenha apenas <span class='path'>winbox</span> e, se necessário, <span class='path'>ssh</span>."]},{"title":"Restringir WinBox e SSH somente à rede local","steps":["Abra <span class='path'>IP → Services</span>.","Abra o serviço <span class='path'>winbox</span>.","No campo <span class='path'>Available From</span>, informe somente a rede local. Exemplo: <span class='path'>192.168.10.0/24</span>.","Repita no serviço <span class='path'>ssh</span>, caso ele esteja ativo.","Não coloque a rede da internet ou <span class='path'>0.0.0.0/0</span>."]},{"title":"Desativar descoberta e acesso por MAC na porta WAN","steps":["Abra <span class='path'>IP → Neighbors → Discovery Settings</span>.","Permita descoberta somente na lista de interfaces LAN.","Abra <span class='path'>Tools → MAC Server</span>.","Em <span class='path'>Allowed Interface List</span>, escolha apenas a lista LAN.","Abra a guia <span class='path'>MAC WinBox</span> e também permita somente pela LAN."]}]},{"title":"Rede local","items":[{"title":"Criar uma bridge para as portas LAN","steps":["Abra <span class='path'>Bridge</span>.","Na guia <span class='path'>Bridge</span>, clique em <span class='path'>+</span>.","Crie a bridge com o nome <span class='path'>bridge-LAN</span>.","Abra a guia <span class='path'>Ports</span>.","Adicione uma por uma as portas LAN à bridge.","Não adicione a porta WAN na bridge."]},{"title":"Criar listas de interfaces WAN e LAN","steps":["Abra <span class='path'>Interfaces → Interface List</span>.","Crie a lista <span class='path'>WAN</span>.","Crie a lista <span class='path'>LAN</span>.","Na guia <span class='path'>Members</span>, adicione a porta de internet à lista WAN.","Adicione a <span class='path'>bridge-LAN</span> à lista LAN."]},{"title":"Definir o IP da rede local no MikroTik","steps":["Abra <span class='path'>IP → Addresses</span>.","Clique em <span class='path'>+</span>.","Informe o endereço da rede local. Exemplo: <span class='path'>192.168.10.1/24</span>.","Em <span class='path'>Interface</span>, selecione <span class='path'>bridge-LAN</span>.","Salve."]},{"title":"Criar o servidor DHCP da rede local","steps":["Abra <span class='path'>IP → DHCP Server</span>.","Clique em <span class='path'>DHCP Setup</span>.","Selecione <span class='path'>bridge-LAN</span>.","Confirme a rede, por exemplo <span class='path'>192.168.10.0/24</span>.","Confirme o gateway <span class='path'>192.168.10.1</span>.","Defina a faixa de entrega, por exemplo <span class='path'>192.168.10.100-192.168.10.250</span>.","Informe os servidores DNS.","Finalize o assistente e renove o IP do computador."]}]},{"title":"Conexão com a internet","items":[{"title":"Configurar a WAN por DHCP","steps":["Use esta etapa quando o modem ou roteador do provedor entrega IP automaticamente.","Abra <span class='path'>IP → DHCP Client</span>.","Clique em <span class='path'>+</span>.","Selecione a porta WAN, por exemplo <span class='path'>ether1</span>.","Deixe <span class='path'>Add Default Route</span> ativado.","Deixe <span class='path'>Use Peer DNS</span> desativado se você for configurar DNS manualmente.","Salve e confirme se o status ficou <span class='path'>bound</span>."],"note":"Use esta etapa ou a etapa PPPoE. Normalmente não se usa as duas na mesma porta."},{"title":"Configurar a WAN por PPPoE","steps":["Use esta etapa quando o provedor forneceu usuário e senha PPPoE.","Abra <span class='path'>PPP</span>.","Clique em <span class='path'>+</span> e escolha <span class='path'>PPPoE Client</span>.","Na guia General, selecione a porta WAN.","Na guia Dial Out, informe usuário e senha.","Marque <span class='path'>Add Default Route</span>.","Desmarque <span class='path'>Use Peer DNS</span> se usar DNS manual.","Salve e confirme se o status ficou conectado.","Adicione a interface PPPoE à lista WAN."]},{"title":"Configurar os servidores DNS","steps":["Abra <span class='path'>IP → DNS</span>.","Informe servidores confiáveis, por exemplo <span class='path'>1.1.1.1</span> e <span class='path'>8.8.8.8</span>.","Ative <span class='path'>Allow Remote Requests</span> para que os clientes da LAN usem o MikroTik como DNS.","Nunca permita consultas DNS vindas da WAN.","Salve."]},{"title":"Criar a regra de NAT para a rede navegar","steps":["Abra <span class='path'>IP → Firewall → NAT</span>.","Clique em <span class='path'>+</span>.","Em Chain, escolha <span class='path'>srcnat</span>.","Em Out. Interface List, escolha <span class='path'>WAN</span>.","Na guia Action, escolha <span class='path'>masquerade</span>.","Salve."]}]},{"title":"Firewall e endurecimento","items":[{"title":"Permitir conexões estabelecidas e relacionadas no INPUT","steps":["Abra <span class='path'>IP → Firewall → Filter Rules</span>.","Crie uma regra com Chain <span class='path'>input</span>.","Em Connection State, marque <span class='path'>established</span> e <span class='path'>related</span>.","Em Action, escolha <span class='path'>accept</span>.","Mova essa regra para o início da lista."]},{"title":"Descartar conexões inválidas no INPUT","steps":["Crie uma regra com Chain <span class='path'>input</span>.","Em Connection State, marque <span class='path'>invalid</span>.","Em Action, escolha <span class='path'>drop</span>.","Coloque a regra logo abaixo da regra de established/related."]},{"title":"Permitir ICMP para diagnóstico","steps":["Crie uma regra com Chain <span class='path'>input</span>.","Em Protocol, escolha <span class='path'>icmp</span>.","Em Action, escolha <span class='path'>accept</span>.","Essa regra permite testes de ping e mensagens necessárias ao funcionamento da rede."]},{"title":"Bloquear todo o restante que chegar ao roteador","steps":["Crie uma regra com Chain <span class='path'>input</span>.","Em In. Interface List, escolha <span class='path'>!LAN</span>, ou crie uma regra final sem interface específica.","Em Action, escolha <span class='path'>drop</span>.","Mantenha essa regra por último na cadeia INPUT.","Antes de ativar, confirme que todas as regras necessárias de acesso e gerenciamento estão acima dela."],"note":"Ative o Safe Mode no WinBox antes de mexer no firewall para evitar perder o acesso."},{"title":"Proteger o encaminhamento entre LAN e internet","steps":["Na cadeia <span class='path'>forward</span>, permita conexões <span class='path'>established</span> e <span class='path'>related</span>.","Descarte conexões <span class='path'>invalid</span>.","Permita tráfego iniciado pela LAN com destino à WAN.","Permita conexões de entrada somente quando forem resultado de uma regra de dst-nat válida.","Crie uma regra final descartando novas conexões vindas da WAN que não sejam dst-nat."]},{"title":"Criar acesso externo com IP fixo (caso tenha)","steps":["Confirme com o provedor se o link possui um <span class='path'>IP público fixo</span>. IP fixo interno ou IP de CGNAT não permite acesso externo direto.","Abra <span class='path'>IP → Addresses</span> ou verifique o endereço recebido na interface WAN e anote o IP público.","Compare o IP da WAN com o IP mostrado em um site de consulta. Se forem diferentes, confirme com o provedor se existe CGNAT.","Defina um IP fixo para o equipamento interno que será acessado, usando endereço manual ou uma reserva em <span class='path'>IP → DHCP Server → Leases → Make Static</span>.","Anote o IP interno, o protocolo e a porta do equipamento. Exemplo: DVR <span class='path'>192.168.10.20</span>, porta externa <span class='path'>8000</span>, protocolo <span class='path'>TCP</span>.","Abra <span class='path'>IP → Firewall → NAT</span> e clique em <span class='path'>+</span>.","Na guia General, selecione Chain <span class='path'>dstnat</span>, protocolo TCP ou UDP, informe o IP público no campo <span class='path'>Dst. Address</span> se necessário e coloque a porta externa em <span class='path'>Dst. Port</span>.","Na guia Action, escolha <span class='path'>dst-nat</span>, informe o IP interno em <span class='path'>To Addresses</span> e a porta interna em <span class='path'>To Ports</span>.","Confirme que o firewall da cadeia <span class='path'>forward</span> permite conexões marcadas como <span class='path'>dstnat</span>. Evite liberar portas diretamente na cadeia INPUT quando o destino for um DVR, câmera, servidor ou outro equipamento da LAN.","Teste usando o 4G ou 5G do celular, fora do Wi-Fi do cliente. Não use apenas um teste feito dentro da mesma rede.","Caso precise acessar pelo mesmo endereço público estando dentro da LAN, configure NAT Loopback somente depois de confirmar que o acesso externo já funciona.","Registre o IP público, porta externa, porta interna, protocolo, equipamento e data da configuração."],"note":"Abra somente as portas necessárias e prefira VPN para serviços administrativos. Nunca exponha WinBox, SSH, câmeras ou servidores sem restrição de origem e senha forte."},{"title":"Desativar serviços auxiliares não utilizados","steps":["Abra <span class='path'>IP → Cloud</span> e desative DDNS se não for usar.","Abra <span class='path'>IP → SNMP</span> e mantenha desativado se não houver monitoramento.","Abra <span class='path'>Routing → BFD</span> e outros protocolos dinâmicos apenas se forem realmente necessários.","Evite manter recursos ativos sem uso."]}]},{"title":"Ajustes finais","items":[{"title":"Configurar nome do equipamento, data e horário","steps":["Abra <span class='path'>System → Identity</span> e defina um nome identificável.","Abra <span class='path'>System → Clock</span> e escolha o fuso correto.","Abra <span class='path'>System → NTP Client</span>.","Ative o NTP e informe servidores de horário.","Confirme que a data e a hora ficaram corretas."]},{"title":"Atualizar o RouterOS e o firmware da RouterBOARD","steps":["Abra <span class='path'>System → Packages</span>.","Clique em <span class='path'>Check for Updates</span>.","Use o canal estável.","Atualize e aguarde o reinício.","Depois, abra <span class='path'>System → RouterBOARD</span>.","Clique em <span class='path'>Upgrade</span> e reinicie novamente.","Confirme se Current Firmware e Upgrade Firmware ficaram iguais."],"note":"Faça a atualização em uma janela segura, pois o equipamento será reiniciado."},{"title":"Testar IP, gateway, DNS e navegação","steps":["No MikroTik, abra <span class='path'>New Terminal</span>.","Teste o gateway do provedor.","Teste <span class='path'>ping 8.8.8.8</span>.","Teste <span class='path'>ping google.com</span>.","No computador, confirme que recebeu IP, gateway e DNS.","Abra alguns sites e teste a estabilidade da conexão."]},{"title":"Criar backup e exportar a configuração","steps":["Abra <span class='path'>Files</span>.","Clique em <span class='path'>Backup</span>.","Defina um nome e uma senha para o arquivo de backup.","Abra o Terminal e execute uma exportação com dados sensíveis ocultos.","Baixe o arquivo de backup e o arquivo de exportação para um local seguro.","Identifique os arquivos com nome do cliente e data."],"note":"O backup binário é melhor para restaurar no mesmo equipamento. A exportação em texto é melhor para consulta e reconstrução."}]}];
const categoryIcons=["⚙","🔐","🌐","⇄","🛡","✓"];
const navItems=[
  {id:"home",label:"Início",icon:"⌂"},
  {id:"mikrotik",label:"MikroTik",icon:"◉"},
  {id:"favorites",label:"Favoritos",icon:"★"},
  {id:"history",label:"Atividade",icon:"↻"},
  {id:"settings",label:"Configurações",icon:"⚙"}
];
const STORAGE_KEY="cloudTechPortalV2";
const oldState=JSON.parse(localStorage.getItem("mikrotikChecklistState")||"{}");
const defaults={completed:{},started:{},favorites:{},notes:{},history:[],theme:"guntech",motion:true,sidebarCollapsed:false};
let state=loadState();
let openTasks=new Set();
let expandAllMode=false;
let deferredInstallPrompt=null;
let searchIndex=-1;

function slugify(v){return v.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"")}
function allTasks(){let n=0;return sections.flatMap((section,si)=>section.items.map((item,ii)=>({section,si,item,ii,id:slugify(section.title+"-"+item.title),legacy:"item-"+(n++)})))}
const tasks=allTasks();
function loadState(){let saved={};try{saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")||{}}catch(e){}const merged={...defaults,...saved,completed:{...(saved.completed||{})},started:{...(saved.started||{})},favorites:{...(saved.favorites||{})},notes:{...(saved.notes||{})},history:Array.isArray(saved.history)?saved.history:[]};tasks.forEach(t=>{if(oldState[t.legacy]&&!merged.completed[t.id])merged.completed[t.id]=true});return merged}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function cleanText(html){const d=document.createElement("div");d.innerHTML=html;return d.textContent||""}
function stats(list=tasks){const done=list.filter(t=>state.completed[t.id]).length;const total=list.length;return{done,total,percent:total?Math.round(done/total*100):0}}
function categoryStats(si){return stats(tasks.filter(t=>t.si===si))}
function recentHistory(limit=6){return state.history.slice(0,limit)}
function addHistory(type,task){const labels={complete:"Etapa concluída",reopen:"Etapa reaberta",favorite:"Adicionado aos favoritos",unfavorite:"Removido dos favoritos",reset:"Checklist reiniciado",import:"Dados importados"};state.history.unshift({type,label:labels[type]||type,title:task?.item?.title||"Checklist MikroTik",category:task?.section?.title||"Sistema",time:Date.now()});state.history=state.history.slice(0,80)}
function formatTime(ts){const diff=Date.now()-ts;if(diff<60000)return"agora";if(diff<3600000)return Math.floor(diff/60000)+" min";if(diff<86400000)return Math.floor(diff/3600000)+" h";return new Intl.DateTimeFormat("pt-BR",{day:"2-digit",month:"short"}).format(ts)}
function escapeHtml(v=""){return String(v).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function taskById(id){return tasks.find(t=>t.id===id)}
function currentRoute(){const raw=(location.hash||"#home").slice(1);const [view,...rest]=raw.split("/");return{view:view||"home",rest}}
function go(route){location.hash="#"+route;if(location.hash==="#"+route)render()}
function setTheme(theme){state.theme=theme;document.body.dataset.theme=theme;document.querySelector('meta[name="theme-color"]').content=theme==="light"?"#f3f5f8":theme==="dark"?"#0c1016":"#08080a";saveState();render()}
function cycleTheme(){const arr=["guntech","dark","light"];setTheme(arr[(arr.indexOf(state.theme)+1)%arr.length]);toast("Tema alterado")}
function applySettings(){document.body.dataset.theme=state.theme;document.body.classList.toggle("reduce-motion",!state.motion);document.body.classList.toggle("sidebar-collapsed",state.sidebarCollapsed)}
function toast(message){const el=document.createElement("div");el.className="toast";el.textContent=message;document.getElementById("toasts").appendChild(el);setTimeout(()=>el.remove(),2800)}

function renderNav(){const route=currentRoute();const active=route.view==="mikrotik"?"mikrotik":route.view;const favCount=Object.values(state.favorites).filter(Boolean).length;document.getElementById("sideNav").innerHTML=navItems.map(n=>`<button class="nav-btn ${active===n.id?"active":""}" onclick="go('${n.id}')"><span class="nav-icon">${n.icon}</span><span class="nav-label">${n.label}</span>${n.id==="favorites"&&favCount?`<span class="nav-badge">${favCount}</span>`:""}</button>`).join("");document.getElementById("bottomNav").innerHTML=navItems.map(n=>`<button class="${active===n.id?"active":""}" onclick="go('${n.id}')"><span>${n.icon}</span><span>${n.label}</span></button>`).join("")}
function setTop(title,subtitle){document.getElementById("topTitle").textContent=title;document.getElementById("topSubtitle").textContent=subtitle}
function render(){applySettings();renderNav();const route=currentRoute();const main=document.getElementById("mainContent");if(route.view==="mikrotik")renderMikrotik(main,route.rest);else if(route.view==="favorites")renderFavorites(main);else if(route.view==="history")renderHistory(main);else if(route.view==="settings")renderSettings(main);else renderHome(main);setTimeout(()=>main.focus({preventScroll:true}),0)}

function renderHome(main){setTop("Portal Cloud Tech","Ferramentas técnicas em um só lugar");const s=stats();const next=tasks.find(t=>!state.completed[t.id]);const history=recentHistory(4);main.innerHTML=`
<section class="page-head"><div><div class="eyebrow">GunTech • versão ${VERSION}</div><h1>Portal Cloud Tech</h1><p>Procedimentos técnicos organizados para uso rápido em campo, com progresso, favoritos e histórico salvos neste navegador.</p></div><div class="page-actions"><button class="soft-btn" onclick="openSearch()">⌕ Pesquisar</button><button class="primary-btn" onclick="go('mikrotik')">Abrir ferramentas</button></div></section>
<section class="bento">
  <article class="card hero-card span-12"><div class="hero-copy"><div class="eyebrow">Primeiro programa disponível</div><h2>Configure MikroTik com segurança e sem esquecer etapas.</h2><p>Checklist completo de internet, rede local, segurança, firewall, acesso externo, testes e backup.</p><div class="hero-actions"><button class="primary-btn" onclick="${next?`openTask('${next.id}')`:`go('mikrotik')`}">${next?"Continuar configuração":"Revisar checklist"}</button><button class="soft-btn" onclick="go('mikrotik')">Ver categorias</button></div></div><div class="hero-art"><img src="${LOGO_DATA}" alt="GunTech"></div></article>
  <article class="card card-pad span-4"><div class="metric"><div class="metric-icon">◉</div><div><strong>${s.percent}%</strong><span>Progresso MikroTik</span></div></div><div class="progress-line" style="margin-top:18px"><span style="width:${s.percent}%"></span></div><div class="progress-meta"><span>${s.done} concluídas</span><span>${s.total-s.done} pendentes</span></div></article>
  <article class="card card-pad span-4"><div class="metric"><div class="metric-icon">★</div><div><strong>${Object.values(state.favorites).filter(Boolean).length}</strong><span>Etapas favoritas</span></div></div><button class="soft-btn" onclick="go('favorites')" style="margin-top:18px;width:100%">Abrir atalhos</button></article>
  <article class="card card-pad span-4"><div class="metric"><div class="metric-icon">＋</div><div><strong>Instalar</strong><span>Adicionar ao dispositivo</span></div></div><button class="soft-btn" onclick="installPortal()" style="margin-top:18px;width:100%">Instalar portal</button></article>
  <article class="card span-8"><div class="card-pad"><h2 class="mini-title">Programas</h2><div class="bento" style="gap:10px"><button class="card tool-card span-6" onclick="go('mikrotik')"><div class="tool-top"><div class="tool-icon">◉</div><span class="status-pill available"><i class="status-dot"></i>Disponível</span></div><h3>Checklist MikroTik</h3><p>Configuração completa do RouterOS v7.</p><div class="tool-footer">Abrir programa →</div></button><div class="card tool-card span-6" aria-disabled="true"><div class="tool-top"><div class="tool-icon">⌁</div><span class="status-pill dev"><i class="status-dot"></i>Em desenvolvimento</span></div><h3>Próxima ferramenta</h3><p>O portal está preparado para receber novos programas.</p><div class="tool-footer" style="color:var(--muted)">Em breve</div></div></div></div></article>
  <article class="card card-pad span-4"><h2 class="mini-title">Atividade recente</h2>${history.length?`<div class="activity-list">${history.map(activityHtml).join("")}</div><button class="soft-btn" onclick="go('history')" style="margin-top:12px;width:100%">Ver histórico</button>`:`<div class="empty"><strong>Nenhuma atividade ainda</strong>Marque uma etapa para começar.</div>`}</article>
</section>`}
function activityHtml(h){const icons={complete:"✓",reopen:"↺",favorite:"★",unfavorite:"☆",reset:"!",import:"⇩"};return`<div class="activity-item"><div class="activity-icon">${icons[h.type]||"•"}</div><div><strong>${escapeHtml(h.label)}</strong><span>${escapeHtml(h.title)}</span></div><div class="activity-time">${formatTime(h.time)}</div></div>`}

function renderMikrotik(main,rest){setTop("Checklist MikroTik","RouterOS v7 • configuração completa");const s=stats();const routeMode=rest[0];const si=routeMode==="category"?sections.findIndex(sec=>slugify(sec.title)===rest[1]):-1;if(routeMode==="category"&&si>=0)return renderCategory(main,si);if(routeMode==="all")return renderAll(main);const next=tasks.find(t=>!state.completed[t.id]);main.innerHTML=`
<section class="page-head"><div><div class="eyebrow">Programa disponível</div><h1>Checklist MikroTik</h1><p>Escolha uma categoria para executar o procedimento por partes. O progresso é salvo automaticamente.</p></div><div class="page-actions"><button class="soft-btn" onclick="openSearch('mikrotik')">⌕ Pesquisar etapa</button><button class="primary-btn" onclick="${next?`openTask('${next.id}')`:"go('mikrotik/all')"}">${next?"Continuar":"Revisar"}</button></div></section>
<section class="overview"><article class="card progress-card"><div class="progress-ring" style="--p:${s.percent}"><strong>${s.percent}%</strong></div><p>${s.done} de ${s.total} etapas concluídas</p></article><article class="card overview-info"><div class="eyebrow">Configuração completa</div><h2>${s.percent===100?"Checklist concluído":"Próxima etapa: "+escapeHtml(next?.item.title||"")}</h2><p>${s.percent===100?"Todas as etapas foram marcadas. Você pode revisar ou exportar os dados.":"Continue de onde parou ou abra uma categoria específica."}</p><div class="overview-actions"><button class="primary-btn" onclick="${next?`openTask('${next.id}')`:"go('mikrotik/all')"}">${next?"Continuar configuração":"Ver todas"}</button><button class="soft-btn" onclick="go('mikrotik/all')">Todas as etapas</button><button class="soft-btn" onclick="exportData()">Exportar progresso</button></div><div class="legend"><span class="done"><i></i>Concluído</span><span class="doing"><i></i>Em andamento</span><span><i></i>Não iniciado</span><span class="attention"><i></i>Nota de atenção</span></div></article></section>
<div class="category-grid">${sections.map((sec,index)=>categoryCardHtml(sec,index)).join("")}</div>`}
function categoryCardHtml(sec,si){const s=categoryStats(si);const stateLabel=s.percent===100?"Concluído":s.percent>0?"Em andamento":"Não iniciado";const cls=s.percent===100?"done":s.percent>0?"doing":"";return`<button class="card category-card" onclick="go('mikrotik/category/${slugify(sec.title)}')"><div class="category-head"><div class="category-icon">${categoryIcons[si]||"•"}</div><span class="category-state ${cls}">${stateLabel}</span></div><h3>${escapeHtml(sec.title)}</h3><p>${s.done} de ${s.total} etapas</p><div class="category-progress"><div class="progress-line"><span style="width:${s.percent}%"></span></div><div class="progress-meta"><span>${s.percent}%</span><span>Abrir →</span></div></div></button>`}
function toolbarHtml(){return`<div class="task-toolbar"><button class="soft-btn" onclick="openSearch('mikrotik')">⌕ <span class="wide-label">Pesquisar</span></button><button class="soft-btn" onclick="toggleExpandAll()">${expandAllMode?"⊟":"⊞"} <span class="wide-label">${expandAllMode?"Fechar todos":"Abrir todos"}</span></button><div class="toolbar-spacer"></div><div class="more-wrap"><button class="soft-btn" onclick="toggleMore(event)">•••</button><div class="more-menu" id="moreMenu"><button onclick="exportData()">Exportar progresso</button><button onclick="document.getElementById('importFile').click()">Importar progresso</button><button onclick="window.print()">Imprimir checklist</button><button onclick="resetChecklist()" style="color:var(--danger)">Zerar checklist</button></div></div></div>`}
function renderCategory(main,si){const sec=sections[si],list=tasks.filter(t=>t.si===si),s=stats(list);main.innerHTML=`<div class="breadcrumb"><button onclick="go('mikrotik')">Checklist MikroTik</button><span>›</span><span>${escapeHtml(sec.title)}</span></div><section class="page-head"><div><div class="eyebrow">Categoria ${si+1} de ${sections.length}</div><h1>${escapeHtml(sec.title)}</h1><p>${s.done} de ${s.total} etapas concluídas • ${s.percent}%</p></div></section>${toolbarHtml()}<div class="task-list">${list.map(taskHtml).join("")}</div>`;syncExpanded()}
function renderAll(main){main.innerHTML=`<div class="breadcrumb"><button onclick="go('mikrotik')">Checklist MikroTik</button><span>›</span><span>Todas as etapas</span></div><section class="page-head"><div><div class="eyebrow">Visão completa</div><h1>Todas as etapas</h1><p>Use a pesquisa ou abra somente os itens necessários.</p></div></section>${toolbarHtml()}${sections.map((sec,si)=>`<h2 class="task-group-title">${escapeHtml(sec.title)}</h2><div class="task-list">${tasks.filter(t=>t.si===si).map(taskHtml).join("")}</div>`).join("")}`;syncExpanded()}
function taskStatus(t){if(state.completed[t.id])return"Concluído";if(state.started[t.id])return"Em andamento";return"Não iniciado"}
function taskHtml(t){const complete=!!state.completed[t.id],started=!!state.started[t.id],open=expandAllMode||openTasks.has(t.id);return`<article class="task-card ${complete?"complete":""} ${started?"started":""} ${open?"open":""}" id="task-${t.id}" data-task="${t.id}"><div class="task-head"><input class="task-check" type="checkbox" ${complete?"checked":""} aria-label="Marcar ${escapeHtml(t.item.title)} como concluído" onchange="toggleComplete('${t.id}',this.checked)"><button class="task-toggle" onclick="toggleTask('${t.id}')" aria-expanded="${open}"><strong>${escapeHtml(t.item.title)}</strong><span>${escapeHtml(t.section.title)} • ${taskStatus(t)}${t.item.note?" • atenção":""}</span></button><button class="star-btn ${state.favorites[t.id]?"active":""}" onclick="toggleFavorite('${t.id}')" aria-label="Favoritar">${state.favorites[t.id]?"★":"☆"}</button><button class="chevron-btn" onclick="toggleTask('${t.id}')" aria-label="Abrir passo a passo">⌄</button></div><div class="task-details"><div><div class="task-body"><ol class="steps">${t.item.steps.map(step=>`<li>${step}</li>`).join("")}</ol>${t.item.note?`<div class="note"><strong>Atenção:</strong> ${escapeHtml(t.item.note)}</div>`:""}${t.item.title.startsWith("Criar acesso externo")?externalFields(t):""}</div></div></div></article>`}
function externalFields(t){const d=state.notes[t.id]||{};const field=(key,label,type="text",full=false)=>`<div class="field ${full?"full":""}"><label for="${t.id}-${key}">${label}</label>${type==="textarea"?`<textarea id="${t.id}-${key}" oninput="saveNote('${t.id}','${key}',this.value)">${escapeHtml(d[key]||"")}</textarea>`:`<input id="${t.id}-${key}" value="${escapeHtml(d[key]||"")}" oninput="saveNote('${t.id}','${key}',this.value)">`}</div>`;return`<div class="field-grid">${field("publicIp","IP público fixo")}${field("internalIp","IP interno do equipamento")}${field("externalPort","Porta externa")}${field("internalPort","Porta interna")}${field("equipment","Equipamento / descrição")}${field("protocol","Protocolo (TCP/UDP)")}${field("notes","Observações","textarea",true)}</div>`}
function saveNote(id,key,value){state.notes[id]??={};state.notes[id][key]=value;saveState()}
function syncExpanded(){document.querySelectorAll(".task-card").forEach(card=>{const open=expandAllMode||openTasks.has(card.dataset.task);card.classList.toggle("open",open);card.querySelector(".task-toggle")?.setAttribute("aria-expanded",open)})}
function toggleTask(id){if(openTasks.has(id))openTasks.delete(id);else{openTasks.add(id);state.started[id]=true;saveState()}syncExpanded()}
function toggleExpandAll(){expandAllMode=!expandAllMode;render()}
function toggleComplete(id,checked){const t=taskById(id);state.completed[id]=checked;if(checked)state.started[id]=true;addHistory(checked?"complete":"reopen",t);saveState();const y=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo(0,y));toast(checked?"Etapa concluída":"Etapa reaberta")}
function toggleFavorite(id){const t=taskById(id);state.favorites[id]=!state.favorites[id];addHistory(state.favorites[id]?"favorite":"unfavorite",t);saveState();render();toast(state.favorites[id]?"Adicionado aos favoritos":"Removido dos favoritos")}
function openTask(id){const t=taskById(id);if(!t)return;openTasks.add(id);state.started[id]=true;saveState();go(`mikrotik/category/${slugify(t.section.title)}`);setTimeout(()=>document.getElementById("task-"+id)?.scrollIntoView({behavior:state.motion?"smooth":"auto",block:"center"}),80)}

function renderFavorites(main){setTop("Favoritos","Atalhos para etapas frequentes");const list=tasks.filter(t=>state.favorites[t.id]);main.innerHTML=`<section class="page-head"><div><div class="eyebrow">Atalhos pessoais</div><h1>Favoritos</h1><p>Etapas marcadas com estrela aparecem aqui para acesso rápido.</p></div><div class="page-actions"><button class="soft-btn" onclick="openSearch()">Adicionar pela pesquisa</button></div></section>${list.length?`<div class="favorite-list">${list.map(t=>`<button class="card favorite-card" onclick="openTask('${t.id}')"><div class="category-icon">${categoryIcons[t.si]}</div><div><h3>${escapeHtml(t.item.title)}</h3><p>${escapeHtml(t.section.title)} • ${taskStatus(t)}</p></div><span style="color:#f6c445">★</span></button>`).join("")}</div>`:`<div class="card empty"><strong>Nenhum favorito</strong>Abra uma etapa e toque na estrela para criar um atalho.</div>`}`}
function renderHistory(main){setTop("Atividade","Histórico salvo neste navegador");main.innerHTML=`<section class="page-head"><div><div class="eyebrow">Registro local</div><h1>Atividade recente</h1><p>Ações realizadas no checklist. O histórico não é enviado para nenhum servidor.</p></div><div class="page-actions"><button class="danger-btn" onclick="clearHistory()">Limpar histórico</button></div></section><article class="card card-pad">${state.history.length?`<div class="activity-list">${state.history.map(activityHtml).join("")}</div>`:`<div class="empty"><strong>Histórico vazio</strong>As próximas ações aparecerão aqui.</div>`}</article>`}
function clearHistory(){if(!confirm("Limpar o histórico de atividades?"))return;state.history=[];saveState();render()}
function renderSettings(main){setTop("Configurações","Aparência, dados e instalação");const s=stats();main.innerHTML=`<section class="page-head"><div><div class="eyebrow">Portal Cloud Tech</div><h1>Configurações</h1><p>Personalize a interface e gerencie os dados salvos localmente.</p></div></section><div class="settings-grid"><article class="card setting-card span-1"><h3>Tema</h3><p>Escolha a aparência do portal.</p><div class="theme-options">${[['guntech','GunTech'],['dark','Escuro'],['light','Claro']].map(([id,label])=>`<button class="theme-option ${state.theme===id?"active":""}" onclick="setTheme('${id}')">${label}</button>`).join("")}</div></article><article class="card setting-card"><div class="switch-row"><div><h3>Movimentos</h3><p style="margin-bottom:0">Animações e rolagem suave.</p></div><label class="switch"><input type="checkbox" ${state.motion?"checked":""} onchange="toggleMotion(this.checked)"><span class="slider"></span></label></div></article><article class="card setting-card"><h3>Instalar portal</h3><p>Adicione o site ao celular ou computador.</p><button class="primary-btn" onclick="installPortal()">Instalar / adicionar</button></article><article class="card setting-card"><h3>Dados locais</h3><p>${s.done} etapas concluídas, ${Object.values(state.favorites).filter(Boolean).length} favoritos e ${state.history.length} atividades.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="soft-btn" onclick="exportData()">Exportar</button><button class="soft-btn" onclick="document.getElementById('importFile').click()">Importar</button></div></article><article class="card setting-card"><h3>Checklist MikroTik</h3><p>Zere apenas o progresso, mantendo o portal instalado e o tema.</p><button class="danger-btn" onclick="resetChecklist()">Zerar checklist</button></article><article class="card setting-card"><h3>Sobre</h3><p>GunTech • Portal Cloud Tech v${VERSION}<br>Arquivo único e sem bibliotecas externas.</p><button class="soft-btn" onclick="sharePortal()">Compartilhar link</button></article></div>`}
function toggleMotion(value){state.motion=value;saveState();applySettings();toast(value?"Movimentos ativados":"Movimentos reduzidos")}
function resetChecklist(){if(!confirm("Apagar todo o progresso do checklist MikroTik?"))return;state.completed={};state.started={};state.notes={};addHistory("reset");saveState();render();toast("Checklist zerado")}
function exportData(){const data={app:"Portal Cloud Tech",version:VERSION,exportedAt:new Date().toISOString(),state};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`cloud-tech-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("Backup exportado")}
function importData(file){const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);const incoming=data.state||data;if(!incoming.completed)throw new Error();state={...state,...incoming,completed:{...(incoming.completed||{})},started:{...(incoming.started||{})},favorites:{...(incoming.favorites||{})},notes:{...(incoming.notes||{})},history:Array.isArray(incoming.history)?incoming.history:state.history};addHistory("import");saveState();render();toast("Dados importados")}catch(e){toast("Arquivo de backup inválido")}};reader.readAsText(file)}
async function sharePortal(){if(navigator.share){try{await navigator.share({title:"Portal Cloud Tech",text:"Ferramentas técnicas GunTech",url:location.href.split('#')[0]})}catch(e){}}else{await navigator.clipboard.writeText(location.href.split('#')[0]);toast("Link copiado")}}

function buildSearch(query="",scope){const q=slugify(query);let list=tasks;if(scope==="mikrotik")list=tasks;if(q)list=list.filter(t=>slugify(t.item.title+" "+t.section.title+" "+t.item.steps.map(cleanText).join(" ")).includes(q));return list.slice(0,40)}
function openSearch(scope){const d=document.getElementById("searchDialog");d.dataset.scope=scope||"";d.showModal();const input=document.getElementById("globalSearch");input.value="";renderSearchResults("");setTimeout(()=>input.focus(),30)}
function closeSearch(){document.getElementById("searchDialog").close()}
function renderSearchResults(q){const scope=document.getElementById("searchDialog").dataset.scope;const list=buildSearch(q,scope);searchIndex=list.length?0:-1;document.getElementById("searchResults").innerHTML=list.length?list.map((t,i)=>`<button class="search-result ${i===0?"selected":""}" data-result="${t.id}" onclick="selectSearch('${t.id}')"><div class="category-icon">${categoryIcons[t.si]}</div><div><strong>${escapeHtml(t.item.title)}</strong><span>${escapeHtml(t.section.title)}</span></div><small>${state.completed[t.id]?"Concluído":state.started[t.id]?"Em andamento":"Abrir"}</small></button>`).join(""):`<div class="empty"><strong>Nenhum resultado</strong>Tente outra palavra.</div>`}
function selectSearch(id){closeSearch();openTask(id)}
function moveSearch(dir){const els=[...document.querySelectorAll(".search-result")];if(!els.length)return;searchIndex=(searchIndex+dir+els.length)%els.length;els.forEach((e,i)=>e.classList.toggle("selected",i===searchIndex));els[searchIndex].scrollIntoView({block:"nearest"})}

function toggleMore(e){e.stopPropagation();document.getElementById("moreMenu")?.classList.toggle("open")}
function showInfo(title,html){document.getElementById("infoDialogCopy").innerHTML=`<h2>${escapeHtml(title)}</h2>${html}`;document.getElementById("infoDialog").showModal()}
async function installPortal(){if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;return}const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);const android=/android/i.test(navigator.userAgent);let copy=ios?`<p>No iPhone ou iPad:</p><ol><li>Abra este site no Safari.</li><li>Toque em <strong>Compartilhar</strong>.</li><li>Escolha <strong>Adicionar à Tela de Início</strong>.</li></ol>`:android?`<p>No Android:</p><ol><li>Abra o menu do navegador.</li><li>Escolha <strong>Instalar app</strong> ou <strong>Adicionar à tela inicial</strong>.</li></ol>`:`<p>No computador:</p><ol><li>Abra o menu do Chrome ou Edge.</li><li>Escolha <strong>Instalar Portal Cloud Tech</strong> ou <strong>Instalar este site como aplicativo</strong>.</li></ol>`;showInfo("Instalar Portal Cloud Tech",copy)}
function initManifest(){try{const manifest={id:location.pathname,name:"Portal Cloud Tech • GunTech",short_name:"Cloud Tech",description:"Ferramentas técnicas e checklist MikroTik da GunTech.",start_url:location.pathname+"#home",scope:location.pathname.replace(/[^/]*$/,"")||"/",display:"standalone",background_color:"#070708",theme_color:"#e21d2f",icons:[{src:ICON_DATA,sizes:"192x192",type:"image/png",purpose:"any maskable"}]};const url=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"}));document.getElementById("manifestLink").href=url}catch(e){}}

window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e;toast("Portal pronto para instalar")});window.addEventListener("appinstalled",()=>toast("Portal instalado"));
document.getElementById("sidebarToggle").addEventListener("click",()=>{state.sidebarCollapsed=!state.sidebarCollapsed;saveState();applySettings()});
document.getElementById("globalSearch").addEventListener("input",e=>renderSearchResults(e.target.value));
document.getElementById("globalSearch").addEventListener("keydown",e=>{if(e.key==="ArrowDown"){e.preventDefault();moveSearch(1)}if(e.key==="ArrowUp"){e.preventDefault();moveSearch(-1)}if(e.key==="Enter"){e.preventDefault();document.querySelectorAll(".search-result")[searchIndex]?.click()}});
document.getElementById("importFile").addEventListener("change",e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=""});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openSearch()}if(e.key==="/"&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();openSearch()}});
document.addEventListener("click",e=>{if(!e.target.closest('.more-wrap'))document.getElementById("moreMenu")?.classList.remove("open")});
window.addEventListener("hashchange",()=>{expandAllMode=false;render();window.scrollTo({top:0,behavior:"auto"})});
let lastScroll=0,ticking=false;window.addEventListener("scroll",()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{const y=scrollY,bar=document.getElementById("topbar");if(innerWidth<=820&&y>lastScroll&&y>110)bar.classList.add("hidden");else bar.classList.remove("hidden");lastScroll=y;ticking=false})},{passive:true});
initManifest();applySettings();render();
</script>
</body>
</html>
